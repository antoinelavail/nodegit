name: Build and Publish NodeGit Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang libssl-dev libkrb5-dev libc++-dev python3

      - name: Install and Build
        env:
          CC: clang
          CXX: clang++
          npm_config_clang: 1
          GYP_DEFINES: use_obsolete_asm=true
        run: |
          npm install
          npm install -g @mapbox/node-pre-gyp

      # Generate JavaScript files
      - name: Generate JavaScript Interface
        run: |
          node generate/index.js

      # Build and package using node-pre-gyp (properly handles binary packaging)
      - name: Build and Package Binary
        run: |
          node-pre-gyp configure build
          node-pre-gyp package

      # Create a full source package with correct structure
      - name: Prepare Full Package
        run: |
          PACKAGE_NAME=$(npm pack)
          # This creates a full source package with proper structure
          echo "Created full source package: $PACKAGE_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/stage/*/*.tar.gz
            *.tgz
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload Artifact (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nodegit-${{ runner.os }}-node${{ matrix.node }}
          path: |
            build/stage/*/*.tar.gz
            *.tgz
