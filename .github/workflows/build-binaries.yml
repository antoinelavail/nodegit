name: Build and Publish NodeGit Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      # Setup steps copied from your existing workflow
      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang libssl-dev libkrb5-dev libc++-dev python3

      - name: Install and Build
        env:
          CC: clang
          CXX: clang++
          npm_config_clang: 1
          GYP_DEFINES: use_obsolete_asm=true
        run: |
          npm install
          npm install -g @mapbox/node-pre-gyp

      # Generate JavaScript files
      - name: Generate JavaScript Interface
        run: |
          # Run the generation process
          node generate/index.js

      # Create complete package with JS files and binary
      - name: Create Complete Package
        run: |
          # Create a directory for the complete package
          mkdir -p complete-package
          
          # Copy binary from build directory
          mkdir -p complete-package/build/Release
          cp -r build/Release/* complete-package/build/Release/
          
          # Copy JS files
          cp -r lib complete-package/
          
          # Copy package.json
          cp package.json complete-package/
          
          # Create tarball
          cd complete-package
          tar -czvf ../nodegit-complete-${{ matrix.node }}-${{ runner.os }}-$(node -e "console.log(process.arch)").tar.gz .

      - name: Package Binary
        run: |
          node lifecycleScripts/clean
          node-pre-gyp package

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/stage/*/*.tar.gz
            nodegit-complete-*.tar.gz
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          # The tag is required for GitHub Releases
          tag_name: ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload Artifact (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nodegit-${{ runner.os }}-node${{ matrix.node }}
          path: |
            build/stage/*/*.tar.gz
            nodegit-complete-*.tar.gz
