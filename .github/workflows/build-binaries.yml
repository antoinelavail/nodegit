name: Build and Publish NodeGit Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      # Setup steps copied from your existing workflow
      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang libssl-dev libkrb5-dev libc++-dev python3

      - name: Install and Build
        env:
          CC: clang
          CXX: clang++
          npm_config_clang: 1
          GYP_DEFINES: use_obsolete_asm=true
        run: |
          npm install
          npm install -g @mapbox/node-pre-gyp

      # Generate JavaScript files BEFORE packaging
      - name: Generate JavaScript Interface
        run: |
          node generate/index.js

      # Now package the binary AND the generated JS files
      - name: Package Binary and JS Files
        run: |
          # Create a modified package command that includes the JS files
          mkdir -p custom-package/build/Release
          cp -r build/Release/*.node custom-package/build/Release/
          mkdir -p custom-package/lib
          cp -r lib/* custom-package/lib/
          
          # Package it up
          cd custom-package
          tar -czvf ../nodegit-v$(node -e "console.log(require('../package.json').version)")-node-v$(node -e "console.log(process.versions.modules)")-$(node -e "console.log(process.platform)")-$(node -e "console.log(process.arch)").tar.gz .

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nodegit-v*-node-*.tar.gz
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Upload Artifact (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nodegit-${{ runner.os }}-node${{ matrix.node }}
          path: nodegit-v*-node-*.tar.gz
